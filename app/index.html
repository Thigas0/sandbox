<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Aplicativo do Glaux: cronograma, resumos com fonte e questões a partir das suas disciplinas no Canvas."
    />
    <meta name="theme-color" content="#0f1d3d" />
    <title>Glaux · app</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link
      rel="preload"
      href="/fonts/newsreader-latin-wght.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="/src/app/app.css" />
  </head>
  <body class="app">
    <a class="pular" href="#tela">Pular para o conteúdo</a>

    <div class="faixa-demo" data-faixa-demo hidden>
      <p>
        <strong>Dados de demonstração.</strong> Disciplinas e conteúdos fictícios, de exemplo; nada
        aqui é saída real do Glaux.
      </p>
      <button type="button" class="faixa-demo__sair" data-sair>Sair do modo demo</button>
    </div>

    <div class="app__grade">
      <nav class="lateral" aria-label="Aplicativo" data-lateral hidden>
        <a class="lateral__marca" href="/" aria-label="Glaux, página inicial">
          <svg class="coruja" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
            <path d="M7 9 L11 12 M25 9 L21 12" />
            <circle cx="11.5" cy="16" r="5" />
            <circle cx="20.5" cy="16" r="5" />
            <circle class="coruja__pupila" cx="11.5" cy="16" r="1.8" />
            <circle class="coruja__pupila" cx="20.5" cy="16" r="1.8" />
            <path d="M14.5 22 L16 24.5 L17.5 22" />
          </svg>
          <span>Glaux</span>
        </a>
        <ul class="lateral__itens">
          <li>
            <a href="#/painel" data-nav="painel"
              ><svg class="icone" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 4h7v7H4zM13 4h7v4h-7zM13 10h7v10h-7zM4 13h7v7H4z" /></svg
              ><span>Painel</span></a
            >
          </li>
          <li>
            <a href="#/disciplinas" data-nav="disciplinas"
              ><svg class="icone" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M5 4h4v16H5zM10 4h4v16h-4zM15.5 5l3.8-1 3 15.4-3.8 1z" /></svg
              ><span>Disciplinas</span></a
            >
          </li>
          <li>
            <a href="#/pratica" data-nav="pratica"
              ><svg class="icone" viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="8" />
                <circle cx="12" cy="12" r="3" /></svg
              ><span>Prática</span></a
            >
          </li>
          <li>
            <button type="button" data-sair>
              <svg class="icone" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M10 5H5v14h5M14 8l4 4-4 4M18 12H9" /></svg
              ><span>Sair</span>
            </button>
          </li>
        </ul>
      </nav>

      <main id="tela" class="tela" tabindex="-1"></main>
    </div>

    <div class="toasts" data-toasts role="status" aria-live="polite"></div>

    <script type="module" src="/src/app/main.js"></script>
  </body>
</html>
